databaseChangeLog:
  - changeSet:
      id: add-institution-table
      author: ohornbeck
      preConditions:
        - onFail: MARK_RAN
          not:
            tableExists:
              tableName: institution
      changes:
        - createTable:
            tableName: institution
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: deleted
                  type: BOOLEAN
                  constraints:
                    nullable: false
              - column:
                  name: deleted_at
                  type: TIMESTAMP
                  constraints:
                    nullable: true
              - column:
                  name: institution_name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: color
                  type: INT
                  constraints:
                    nullable: true
              - column:
                  name: logo
                  type: VARCHAR(20)
                  constraints:
                    nullable: true