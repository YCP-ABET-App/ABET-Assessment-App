databaseChangeLog:
  - changeSet:
      id: add-role-to-users
      author: ohornbeck
      preConditions:
        - onFail: MARK_RAN
          not:
            columnExists:
              tableName: users
              columnName: role
      changes:
        - addColumn:
            tableName: users
            columns:
              - column:
                  name: role
                  type: "ENUM('INSTRUCTOR','OBSERVER','SUPER')"
                  defaultValue: INSTRUCTOR
                  constraints:
                    nullable: false