# Test profile configuration
spring.application.name=abet-assessment-test

# Use H2 in-memory database for tests
spring.datasource.url=jdbc:h2:mem:testdb-${random.uuid};MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;NON_KEYWORDS=VALUE,KEY,ROLE,YEAR
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate configuration
# Must override src/main/resources/application-test.properties (ddl-auto=none).
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=false

# Disable unnecessary features in tests
spring.jpa.open-in-view=false

# Logging configuration for tests
logging.level.root=WARN
logging.level.com.abetappteam.abetapp=DEBUG
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Actuator configuration for tests
management.endpoints.enabled-by-default=false
management.endpoint.health.enabled=true

# Server configuration for tests
server.port=0
server.error.include-message=always
server.error.include-binding-errors=always

# Rate Limiting Configuration - Disabled for unit tests
app.rate-limit.enabled=false
